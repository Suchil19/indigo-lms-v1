<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Plataforma</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Encabezado Responsive con Menú Desplegable -->
  <header class="navbar">
    <div class="logo">
      <a href="dashboard.html" class="brand-title">Mis Cursos</a>
    </div>

    <div class="user-profile">
      <div class="user-menu-container">
        <button id="user-menu-btn" class="user-menu-btn" type="button">
          <img id="nav-user-avatar" src="https://via.placeholder.com/32" alt="Avatar" class="nav-avatar">
          <span id="nav-user-name" class="user-name-text">Cargando...</span>
          <span class="menu-arrow">▼</span>
        </button>

        <div id="user-dropdown-menu" class="dropdown-menu" hidden>
          <a href="dashboard.html" class="dropdown-item">
            <span>🏠</span> Mis Cursos
          </a>
          <a href="profile.html" class="dropdown-item">
            <span>⚙️</span> Editar Perfil
          </a>
          
          <!-- Selector de Tema Claro / Oscuro -->
          <button type="button" id="btn-toggle-theme" class="dropdown-item theme-toggle-btn">
            🌙 <span>Modo Oscuro</span>
          </button>

          <!-- Opción visible si el usuario es Admin -->
          <div id="admin-menu-option" hidden>
            <a href="admin.html" class="dropdown-item">
              <span>🛡️</span> Panel Admin
            </a>
          </div>

          <div class="dropdown-divider"></div>

          <button type="button" id="btn-dropdown-logout" class="dropdown-item text-danger">
            <span>🚪</span> Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </header>
  

  <!-- Contenido Principal -->
  <main class="container">
    <section class="admin-card profile-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
        <h2 style="margin: 0;">Configuración de Perfil</h2>
        <a href="dashboard.html" class="btn-back">⬅️ Volver al Panel</a>
      </div>
      
      <form id="form-profile" class="form-role">
        
        <!-- Avatar Preview -->
        <div class="avatar-container">
          <img id="avatar-preview" src="https://via.placeholder.com/100" alt="Foto de perfil" class="profile-avatar">
        </div>

        <div class="form-group full-width">
          <label for="profile-name">Nombre Completo:</label>
          <input type="text" id="profile-name" required placeholder="Tu nombre y apellidos">
        </div>

        <div class="form-group full-width">
          <label for="profile-alias">Alias / Apodo:</label>
          <input type="text" id="profile-alias" placeholder="Ej. AlexCoder">
        </div>

        <div class="form-group full-width">
          <label for="profile-photo-url">URL de Foto de Perfil:</label>
          <div class="search-box">
            <input type="url" id="profile-photo-url" placeholder="https://ejemplo.com/mi-foto.jpg">
          </div>
          <small class="help-text">Por defecto se utiliza tu foto de Google/Gmail. Puedes ingresar el enlace directo a cualquier otra imagen.</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Guardar Cambios</button>
          <button type="button" id="btn-use-google-photo" class="btn-secondary">Restaurar Foto de Google</button>
        </div>

      </form>
      <p id="profile-status-msg" class="status-msg"></p>
    </section>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
